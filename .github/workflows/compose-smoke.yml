name: Compose Smoke

# Sobe a demonstração completa (Oracle + API + Web) e autentica com o usuário demo.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC (01:00 em Mato Grosso)

permissions:
  contents: read

concurrency:
  group: compose-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
      # Usuário demonstrativo (profile demo) - não é credencial real.
      DEMO_EMAIL: admin@admin.com
      DEMO_SENHA: "12345678"
    steps:
      - name: Verificar secret CROSS_REPO_TOKEN
        id: gate
        run: |
          if [ -z "$CROSS_REPO_TOKEN" ]; then
            {
              echo "## Smoke do Compose NÃO executado"
              echo "O secret **CROSS_REPO_TOKEN** não está configurado."
              echo "O repositório Sema_Nexus_Web é privado; crie um token com acesso **somente leitura** (Contents: read) a ele"
              echo "e cadastre-o em Settings > Secrets and variables > Actions > CROSS_REPO_TOKEN."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Smoke ignorado::Secret CROSS_REPO_TOKEN ausente; o Web é privado e não pôde ser baixado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Sema_Nexus_API
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          path: Sema_Nexus_API

      - name: Checkout Sema_Nexus_Web (lado a lado)
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: Nexus-Builder-Lab/Sema_Nexus_Web
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: Sema_Nexus_Web

      - name: Criar .env com segredos efêmeros
        if: steps.gate.outputs.ok == 'true'
        working-directory: Sema_Nexus_API
        run: |
          cp .env.example .env
          sed -i "s|^ORACLE_PASSWORD=.*|ORACLE_PASSWORD=Ci$(openssl rand -hex 12)|" .env
          sed -i "s|^APP_USER_PASSWORD=.*|APP_USER_PASSWORD=Ci$(openssl rand -hex 12)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env

      - name: Subir o Compose
        if: steps.gate.outputs.ok == 'true'
        working-directory: Sema_Nexus_API
        run: docker compose up -d --build --quiet-pull

      - name: Aguardar serviços healthy (até 15 min)
        if: steps.gate.outputs.ok == 'true'
        working-directory: Sema_Nexus_API
        run: |
          deadline=$((SECONDS + 900))
          while [ $SECONDS -lt $deadline ]; do
            ids=$(docker compose ps -q)
            total=$(echo "$ids" | wc -w)
            healthy=0
            for id in $ids; do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = "healthy" ] && healthy=$((healthy+1))
            done
            echo "healthy: $healthy/$total"
            [ "$total" -gt 0 ] && [ "$healthy" -eq "$total" ] && exit 0
            sleep 15
          done
          echo "::error::Timeout de 15 min aguardando os serviços ficarem healthy"
          docker compose ps
          exit 1

      - name: Login e GET /api/demandas via Web (porta 3000)
        if: steps.gate.outputs.ok == 'true'
        run: |
          resp=$(curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$DEMO_EMAIL\",\"senha\":\"$DEMO_SENHA\"}")
          token=$(echo "$resp" | jq -er '.token')
          echo "::add-mask::$token"
          curl -fsS -o /dev/null -w 'GET /api/demandas -> HTTP %{http_code}\n' \
            http://localhost:3000/api/demandas -H "Authorization: Bearer $token"
          echo "## Smoke do Compose OK" >> "$GITHUB_STEP_SUMMARY"
          echo "Serviços healthy, login e GET /api/demandas responderam com sucesso." >> "$GITHUB_STEP_SUMMARY"

      - name: Coletar logs do Compose
        if: failure() && steps.gate.outputs.ok == 'true'
        working-directory: Sema_Nexus_API
        run: |
          docker compose ps > ../compose-ps.log 2>&1 || true
          docker compose logs --no-color > ../compose-logs.log 2>&1 || true

      - name: Anexar logs (falha)
        if: failure() && steps.gate.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: |
            compose-ps.log
            compose-logs.log
          retention-days: 7

      - name: Limpeza do runner
        if: always() && steps.gate.outputs.ok == 'true'
        working-directory: Sema_Nexus_API
        run: docker compose down --remove-orphans || true
