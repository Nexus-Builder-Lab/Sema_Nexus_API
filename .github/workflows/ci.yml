name: CI API

on:
  push:
    branches: [main, "feature/GH-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-name:
    name: Nome do branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    steps:
      - name: Validar padrão feature/GH-<n>
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$BRANCH" =~ ^feature/GH-[0-9]+$ ]]; then
            echo "Branch válido: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' fora do padrão ^feature/GH-[0-9]+\$ (ver CLAUDE.md)."
            exit 1
          fi

  build-test:
    name: Compilar e testar (Maven)
    runs-on: ubuntu-latest
    outputs:
      has_pom: ${{ steps.detect.outputs.has_pom }}
    steps:
      - uses: actions/checkout@v4

      - name: Detectar projeto Maven
        id: detect
        run: |
          if [ -f pom.xml ]; then
            echo "has_pom=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pom=false" >> "$GITHUB_OUTPUT"
            echo "::warning::pom.xml ainda não existe (Issue #1). Compilação e testes ignorados."
            echo "### ⚠️ Build ignorado: pom.xml ainda não existe (Issue #1)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configurar Java 21
        if: steps.detect.outputs.has_pom == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e executar testes
        if: steps.detect.outputs.has_pom == 'true'
        run: mvn -B -ntp verify

      - name: Relatórios de teste
        if: always() && steps.detect.outputs.has_pom == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  openapi:
    name: Exportar contrato OpenAPI
    runs-on: ubuntu-latest
    needs: build-test
    if: needs.build-test.outputs.has_pom == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Empacotar
        run: mvn -B -ntp -DskipTests package
      - name: Subir API com profile openapi (sem banco) e exportar /v3/api-docs
        run: |
          JAR=$(ls target/*.jar | grep -v plain | head -n1)
          java -jar "$JAR" --spring.profiles.active=openapi --server.port=8080 > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/v3/api-docs -o openapi.json; then break; fi
            sleep 2
          done
          if [ ! -s openapi.json ]; then
            echo "::error::Não foi possível obter /v3/api-docs. Últimas linhas do log:"
            tail -n 80 app.log
            exit 1
          fi
          echo "Contrato exportado: $(wc -c < openapi.json) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          retention-days: 30

  mcp-sema-alerta:
    name: Servidor MCP somente leitura (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar e testar
        working-directory: scripts/mcp-sema-alerta
        run: |
          npm ci
          node --test

  scripts-demo:
    name: Scripts demo-up/down/reset (docker simulado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar scripts em sh POSIX (dash) e bash
        run: |
          # O teste usa um `docker` falso no PATH: não sobe containers nem apaga volumes.
          SH_BIN=sh sh scripts/tests/demo-scripts.test.sh
          SH_BIN=bash bash scripts/tests/demo-scripts.test.sh

  docker-build:
    name: Build da imagem Docker (sem publicar)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Detectar Dockerfile
        id: detect
        run: |
          if [ -f Dockerfile ]; then echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"; else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dockerfile ainda não existe (Issue #2). Build da imagem ignorado."
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.detect.outputs.has_dockerfile == 'true'
      - uses: docker/build-push-action@v6
        if: steps.detect.outputs.has_dockerfile == 'true'
        with:
          context: .
          push: false
          tags: sema-nexus-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
