# SEMA NEXUS — ambiente completo (Oracle Free + API + Web). Issue #8.
# AMBIENTE DEMONSTRATIVO — DADOS FICTÍCIOS.
#
# Uso:  cp .env.example .env   (edite as senhas)   →   docker compose up -d --build
# Os repositórios ficam lado a lado:  ./Sema_Nexus_API (este)  e  ../Sema_Nexus_Web.
# NENHUM segredo neste arquivo: tudo vem do .env (ignorado pelo Git). Ver docs/DOCKER.md.
# Nunca use `docker compose down -v` sem querer perder o banco e os uploads (ver demo-reset).

name: sema-nexus

services:
  # ---------- Banco: Oracle Database 23ai Free ----------
  oracle:
    # Tag fixada (mesma imagem validada nos testes Testcontainers: gvenzl/oracle-free:23-slim-faststart).
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?defina ORACLE_PASSWORD no .env}
      APP_USER: ${APP_USER:?defina APP_USER no .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?defina APP_USER_PASSWORD no .env}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # ---------- Backend: Spring Boot ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
      SPRING_DATASOURCE_USERNAME: ${APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_USER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo 32 caracteres)}
      STORAGE_DIR: /data/uploads
      DOCIA_PROVIDER: ${DOCIA_PROVIDER:-demo}
      DOCIA_API_URL: ${DOCIA_API_URL:-}
      DOCIA_API_KEY: ${DOCIA_API_KEY:-}
      # Agentes de IA (#106): padrão = modelo local (Ollama); sem ele, modo demonstrativo. Claude é opcional.
      AGENTES_PROVEDOR: ${AGENTES_PROVEDOR:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODELO: ${OLLAMA_MODELO:-qwen3:4b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTE_TRIAGEM_MODELO: ${AGENTE_TRIAGEM_MODELO:-claude-haiku-5-5}
      AGENTE_DOCIA_MODELO: ${AGENTE_DOCIA_MODELO:-claude-sonnet-5-5}
      DEMO_RESET_CONFIRM: ${DEMO_RESET_CONFIRM:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ---------- Frontend: React servido pelo Nginx (proxy /api -> api:8080) ----------
  web:
    build:
      context: ../Sema_Nexus_Web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:8080"
    environment:
      # Visão de satélite (Esri World Imagery) opcional; vazio = indisponível. O Nginx usa a chave só no servidor.
      ESRI_API_KEY: ${ESRI_API_KEY:-}

  # ---- IA local (Issue #106): modelo aberto via Ollama, sem custo e sem enviar dados para fora ----------------
  # Opcional: só sobe com COMPOSE_PROFILES=ia (GPU NVIDIA) ou ia-cpu (sem GPU, mais lento). Sem porta no host:
  # apenas a API o acessa, pela rede interna (http://ollama:11434). Modelo: scripts/ia-preparar.ps1.
  ollama:
    image: ollama/ollama:0.40.11
    profiles: ["ia"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NO_CLOUD: "1"  # nunca usar modelos na nuvem: nada sai da máquina
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  ollama-cpu:
    image: ollama/ollama:0.40.11
    profiles: ["ia-cpu"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NO_CLOUD: "1"  # nunca usar modelos na nuvem: nada sai da máquina
    networks:
      default:
        aliases: [ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  oradata:
  uploads:
  ollama:
