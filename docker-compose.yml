# SEMA ALERTA — ambiente completo (Oracle Free + API + Web). Issue #8.
# AMBIENTE DEMONSTRATIVO — DADOS FICTÍCIOS.
#
# Uso:  cp .env.example .env   (edite as senhas)   →   docker compose up -d --build
# Os repositórios ficam lado a lado:  ./Sema_Nexus_API (este)  e  ../Sema_Nexus_Web.
# NENHUM segredo neste arquivo: tudo vem do .env (ignorado pelo Git). Ver docs/DOCKER.md.
# Nunca use `docker compose down -v` sem querer perder o banco e os uploads (ver demo-reset).

name: sema-nexus

services:
  # ---------- Banco: Oracle Database 23ai Free ----------
  oracle:
    # Tag fixada (mesma imagem validada nos testes Testcontainers: gvenzl/oracle-free:23-slim-faststart).
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?defina ORACLE_PASSWORD no .env}
      APP_USER: ${APP_USER:?defina APP_USER no .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?defina APP_USER_PASSWORD no .env}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # ---------- Backend: Spring Boot ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
      SPRING_DATASOURCE_USERNAME: ${APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_USER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo 32 caracteres)}
      STORAGE_DIR: /data/uploads
      DOCIA_PROVIDER: ${DOCIA_PROVIDER:-demo}
      DOCIA_API_URL: ${DOCIA_API_URL:-}
      DOCIA_API_KEY: ${DOCIA_API_KEY:-}
      # Agentes de IA (#106): padrão = modelo local (Ollama); sem ele, modo demonstrativo. Claude é opcional.
      AGENTES_PROVEDOR: ${AGENTES_PROVEDOR:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODELO: ${OLLAMA_MODELO:-qwen3:4b-instruct}
      OLLAMA_PENSAR: ${OLLAMA_PENSAR:-false}
      OLLAMA_MANTER_CARREGADO: ${OLLAMA_MANTER_CARREGADO:-4h}
      AGENTES_AQUECER: ${AGENTES_AQUECER:-true}
      # Fila da GPU e limite de requisições (#134).
      AGENTES_GPU_CONCORRENCIA: ${AGENTES_GPU_CONCORRENCIA:-1}
      AGENTES_GPU_ESPERA_SEGUNDOS: ${AGENTES_GPU_ESPERA_SEGUNDOS:-20}
      # Busca híbrida do DocIA (#141): embeddings locais (nomic-embed-text no mesmo Ollama); sem o modelo, só lexical.
      EMBEDDINGS_ATIVO: ${EMBEDDINGS_ATIVO:-false}
      EMBEDDINGS_MODELO: ${EMBEDDINGS_MODELO:-nomic-embed-text}
      EMBEDDINGS_SIMILARIDADE_MINIMA: ${EMBEDDINGS_SIMILARIDADE_MINIMA:-0.65}
      EMBEDDINGS_REINDEXAR_SEGUNDOS: ${EMBEDDINGS_REINDEXAR_SEGUNDOS:-120}
      BUSCA_RRF_K: ${BUSCA_RRF_K:-60}
      # Streaming SSE dos agentes (#135): intervalo do keepalive (s) e streams simultâneos.
      AGENTES_SSE_BATIMENTO_SEGUNDOS: ${AGENTES_SSE_BATIMENTO_SEGUNDOS:-15}
      AGENTES_SSE_MAX_SIMULTANEOS: ${AGENTES_SSE_MAX_SIMULTANEOS:-16}
      LIMITE_REQUISICOES_ATIVO: ${LIMITE_REQUISICOES_ATIVO:-true}
      LIMITE_JANELA_SEGUNDOS: ${LIMITE_JANELA_SEGUNDOS:-60}
      LIMITE_LOGIN_POR_JANELA: ${LIMITE_LOGIN_POR_JANELA:-20}
      LIMITE_IA_POR_JANELA: ${LIMITE_IA_POR_JANELA:-10}
      LIMITE_UPLOAD_POR_JANELA: ${LIMITE_UPLOAD_POR_JANELA:-20}
      LIMITE_MAX_CHAVES: ${LIMITE_MAX_CHAVES:-10000}
      # Só o Nginx do Web (serviço "web", rede interna) pode informar o IP do cliente em X-Forwarded-For.
      LIMITE_PROXY_CONFIAVEL: ${LIMITE_PROXY_CONFIAVEL:-web}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTE_TRIAGEM_MODELO: ${AGENTE_TRIAGEM_MODELO:-claude-haiku-5-5}
      AGENTE_DOCIA_MODELO: ${AGENTE_DOCIA_MODELO:-claude-sonnet-5-5}
      DEMO_RESET_CONFIRM: ${DEMO_RESET_CONFIRM:-}
    ports:
      # Só no loopback do host (#134): de fora, a API é acessada pelo Nginx do Web (proxy /api -> api:8080, rede interna).
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ---------- Frontend: React servido pelo Nginx (proxy /api -> api:8080) ----------
  web:
    build:
      context: ../Sema_Nexus_Web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:8080"
    environment:
      # Visão de satélite (Esri World Imagery) opcional; vazio = indisponível. O Nginx usa a chave só no servidor.
      ESRI_API_KEY: ${ESRI_API_KEY:-}

  # ---- IA local (Issue #106): modelo aberto via Ollama, sem custo e sem enviar dados para fora ----------------
  # Opcional: só sobe com COMPOSE_PROFILES=ia (GPU NVIDIA) ou ia-cpu (sem GPU, mais lento). Sem porta no host:
  # apenas a API o acessa, pela rede interna (http://ollama:11434). Modelo: scripts/ia-preparar.ps1.
  ollama:
    image: ollama/ollama:0.40.11
    profiles: ["ia"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_MANTER_CARREGADO:-4h}
      OLLAMA_NO_CLOUD: "1"  # nunca usar modelos na nuvem: nada sai da máquina
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  ollama-cpu:
    image: ollama/ollama:0.40.11
    profiles: ["ia-cpu"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_MANTER_CARREGADO:-4h}
      OLLAMA_NO_CLOUD: "1"  # nunca usar modelos na nuvem: nada sai da máquina
    networks:
      default:
        aliases: [ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  oradata:
  uploads:
  ollama:
