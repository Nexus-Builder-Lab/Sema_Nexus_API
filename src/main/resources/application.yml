# SEMA NEXUS API — configuração base (todos os profiles).
# Toda configuração sensível vem de variáveis de ambiente (ver .env.example). Nada de segredos aqui.
spring:
  application:
    name: sema-nexus-api
  profiles:
    default: dev
  autoconfigure:
    # A autenticação é própria (JWT, Issue #4): sem UserDetailsService padrão, o Spring não gera senha no log.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # Oracle (Issue #3). URL, usuário e senha vêm SOMENTE das variáveis de ambiente
  # SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD (ver .env.example).
  datasource:
    hikari:
      pool-name: sema-nexus-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade exclusiva do Flyway; o Hibernate só valida o mapeamento.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: America/Cuiaba
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json
