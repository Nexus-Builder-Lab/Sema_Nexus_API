# SEMA ALERTA API — configuração base (todos os profiles).
# Toda configuração sensível vem de variáveis de ambiente (ver .env.example). Nada de segredos aqui.
spring:
  application:
    name: sema-nexus-api
  profiles:
    default: dev
  autoconfigure:
    # A autenticação é própria (JWT, Issue #4): sem UserDetailsService padrão, o Spring não gera senha no log.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # Oracle (Issue #3). URL, usuário e senha vêm SOMENTE das variáveis de ambiente
  # SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD (ver .env.example).
  datasource:
    hikari:
      pool-name: sema-nexus-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade exclusiva do Flyway; o Hibernate só valida o mapeamento.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Paginação padrão da API: ?page=0&size=20&sort=campo,asc (máx. 500 por página).
        default-page-size: 20
        max-page-size: 500
  jackson:
    default-property-inclusion: non_null
    time-zone: America/Cuiaba
  servlet:
    multipart:
      # Limite de upload do DocIA (10 MB por arquivo; o restante do corpo são só metadados).
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true

semanexus:
  storage:
    # Diretório (volume) dos arquivos do DocIA. Nunca no banco.
    dir: ${STORAGE_DIR:/data/uploads}
  jwt:
    # Segredo HS256 SOMENTE por variável de ambiente (mínimo 32 caracteres). Obrigatório fora de dev/openapi.
    secret: ${JWT_SECRET:}
    expiration: 8h

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json
